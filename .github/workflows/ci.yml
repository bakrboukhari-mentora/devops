name: Node.js CI Pipeline

# 1. Trigger the workflow on pushes to the main branch
on:
  push:
    branches: [ "main" ]

# 2. Define the jobs to run
jobs:
  build-and-test:
    # 3. Specify the server environment (an Ubuntu Linux runner)
    runs-on: ubuntu-latest

    # 4. Define the sequential steps
    steps:
    # Step A: Check out your repository code onto the runner
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step B: Install Node.js
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Step C: Run the test script we defined in package.json
    - name: Run Tests
      run: npm test
